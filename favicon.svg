<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- High-Voltage Lightning Bolt / Power Symbol -->
  <path d="M35 10L19 34h12l-4 20 18-24H33l4-20z" 
        fill="url(#bolt-grad)" 
        filter="url(#glow)"
        stroke="#38bdf8" 
        stroke-width="1" 
        stroke-linejoin="round"/>
</svg>
